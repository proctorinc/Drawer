<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#ffc98a"/>
      <rect width="5" height="12" fill="#ffd9a8"/>
    </pattern>
  </defs>
  <g stroke="#2b2a33" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Sticker with its offset shadow -->
    <circle cx="128" cy="128" r="96" fill="#2b2a33"/>
    <circle cx="116" cy="116" r="96" fill="url(#stripes)"/>

    <!-- Tail feathers -->
    <g transform="translate(116 132)">
      <path d="M0 0L-62-34a62 62 0 0 1 22-36z" fill="#e5483b"/>
      <path d="M0 0L-40-70a62 62 0 0 1 40-8z" fill="#ffb400"/>
      <path d="M0 0V-78a62 62 0 0 1 40 8z" fill="#2f9e5b"/>
      <path d="M0 0L40-70a62 62 0 0 1 22 36z" fill="#e5483b"/>
      <path d="M0 0L-66-6a62 62 0 0 1 4-28z" fill="#ffb400"/>
      <path d="M0 0L62-34a62 62 0 0 1 4 28z" fill="#ffb400"/>
    </g>

    <!-- Body and head -->
    <ellipse cx="116" cy="146" rx="38" ry="34" fill="#9a5320"/>
    <circle cx="116" cy="104" r="22" fill="#c8762d"/>

    <!-- Feet -->
    <path d="M102 178v12m-6 0h12M130 178v12m-6 0h12" fill="none" stroke="#e08a1e"/>

    <!-- Beak and wattle -->
    <path d="M110 108l6 9 6-9z" fill="#ffb400"/>
    <path d="M122 112c6 4 6 14 0 16-4-2-4-10 0-16z" fill="#e5483b"/>
  </g>

  <!-- Eyes and a smile, like the other stickers -->
  <g fill="#2b2a33">
    <circle cx="108" cy="100" r="3.5"/>
    <circle cx="124" cy="100" r="3.5"/>
  </g>
  <path d="M104 152q12 9 24 0" fill="none" stroke="#2b2a33" stroke-width="4" stroke-linecap="round"/>

  <!-- Sparkles -->
  <g fill="#2b2a33">
    <path d="M52 66q0 8 8 8q-8 0-8 8q0-8-8-8q8 0 8-8z"/>
    <path d="M184 172q0 7 7 7q-7 0-7 7q0-7-7-7q7 0 7-7z"/>
  </g>
</svg>
